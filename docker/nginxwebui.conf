# 容器内默认配置。第一次启动会复制到 /home/nginxWebUI/nginxwebui.conf
# 之后改 volume 里那份即可。映射端口要和这里的 port 一致。

port = 8080
# 容器端口映射需要监听所有接口；宿主机请用 HTTPS 反代，不要裸奔公网
bind = 0.0.0.0
home = /home/nginxWebUI
web_dir = /opt/nginxwebui/web
threads = 2
reload_cmd = nginx -s reload
start_nginx = 1

# 宿主机反代（nginx/caddy）经 127.0.0.1:8080 转进容器时，容器看到的来源是
# Docker 网桥网关（通常在 172.16.0.0/12）。只有把它列为受信代理，
# X-Forwarded-For / X-Forwarded-Proto 才会生效（登录限速按真实 IP、Cookie 加 Secure）。
# 默认不信任任何代理。
# trusted_proxies = 172.16.0.0/12

# agent 长轮询线程池：同时在线的远程设备上限（默认 32）
# agent_threads = 32
