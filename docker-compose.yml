services:
  nginxwebui:
    build: .
    image: nginxwebui:latest
    container_name: nginxwebui
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "80:80"
      - "443:443"
    # 端口、路径改 volume 里的 /home/nginxWebUI/nginxwebui.conf
    # 这里的 8080:8080 要和配置文件里的 port 一致
    environment:
      NGINXWEBUI_START_NGINX: "1"
    volumes:
      - nginxwebui-data:/home/nginxWebUI
      - nginxwebui-sites-available:/etc/nginx/sites-available
      - nginxwebui-sites-enabled:/etc/nginx/sites-enabled
      - nginxwebui-ssl:/etc/nginx/ssl
      - nginxwebui-www:/var/www
      - nginxwebui-acme:/root/.acme.sh
      - nginxwebui-logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/adminPage/login/info"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  nginxwebui-data:
  nginxwebui-sites-available:
  nginxwebui-sites-enabled:
  nginxwebui-ssl:
  nginxwebui-www:
  nginxwebui-acme:
  nginxwebui-logs:

# 管理宿主机已有 nginx 时，不要映射 80/443，改成下面这样（与宿主机 nginx 抢端口）：
