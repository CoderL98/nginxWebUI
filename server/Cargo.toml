[package]
name = "nginxwebui"
version = "1.0.0"
edition = "2021"
description = "nginxWebUI server - Rust rewrite of the Java/Solon backend"
license = "MulanPSL-1.0"

[lib]
name = "nginxwebui"
path = "src/lib.rs"

[[bin]]
name = "nginxwebui"
path = "src/main.rs"

[[bin]]
name = "nginxwebui-agent"
path = "src/bin/nginxwebui-agent.rs"

[dependencies]
tiny_http = { version = "0.12", default-features = false, features = ["ssl-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
md-5 = "0.10"
argon2 = "0.5"
password-hash = { version = "0.5", features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.2"
subtle = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
sha2 = "0.10"
ureq = { version = "2.12", features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"

[target."cfg(windows)".dependencies]
windows-service = "0.7"

[dev-dependencies]
rcgen = "0.13"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
