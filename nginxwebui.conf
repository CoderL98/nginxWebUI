# nginxWebUI 配置
# 改端口、数据目录、前端路径只改这一份，然后 restart。
# 相对路径相对于本文件所在目录。
# 命令行和环境变量仍可覆盖这里的值。

# 管理界面端口
port = 8080

# 监听地址。默认只绑本机，避免面板裸奔在公网。
# Docker / 需要远程访问时设为 0.0.0.0，并务必经 HTTPS 反向代理。
# bind = 127.0.0.1

# 经 HTTPS 或反向代理终止 TLS 时，给会话 Cookie 加 Secure。
# 也可设环境变量 NGINXWEBUI_SECURE_COOKIE=1。
# secure_cookie = false

# 受信反向代理（逗号分隔的 IP 或 CIDR）。只有来自这些地址的请求，
# X-Forwarded-For / X-Forwarded-Proto 才会被采信；默认空 = 一律忽略，
# 防止伪造来源 IP 绕过登录/加入限速。本机反代填 127.0.0.1, ::1。
# 也可用环境变量 NGINXWEBUI_TRUSTED_PROXIES 或 --trusted-proxies。
# trusted_proxies = 127.0.0.1, ::1

# agent 长轮询线程池大小 = 同时在线的远程设备上限（默认 32）。
# 也可用 NGINXWEBUI_AGENT_THREADS 或 --agent-threads。
# agent_threads = 32

# 首次初始化令牌也可用环境变量覆盖：NGINXWEBUI_INIT_TOKEN
# 管理员表为空时，启动日志会打印一次性令牌；创建管理员必须带上它和验证码。

# 数据目录：sqlite、pid、日志、安装的二进制
home = .run-home

# 静态前端安装目录。deploy 会把仓库 web/build 整份同步到这里。
# 不要指向仓库里的 web/ 源码目录。
web_dir = .run-home/web

# 工作线程，默认 2（可设 2–4）
threads = 2

# 首次启动时写入的 nginx reload 命令。之后也可在设置页改。
# 不要用 sudo 启动本进程。普通用户写 /etc/nginx / reload 只走助手：
#   sudo script/linux/setup-sudo.sh
# reload_cmd = sudo -n systemctl reload nginx

# 可选。不填则二进制在 {home}/bin/nginxwebui
# bin = .run-home/bin/nginxwebui
# log = .run-home/logs/nginxwebui.log
# pid = .run-home/nginxwebui.pid

# 可选：面板自己提供 HTTPS（PEM）。未设置时仍是明文 HTTP（默认绑 127.0.0.1）。
# 生产环境通常仍建议放在 HTTPS 反代后面。启用后会话 Cookie 会自动加 Secure。
# 也可用 NGINXWEBUI_TLS_CERT / NGINXWEBUI_TLS_KEY 或 --tls-cert / --tls-key。
# tls_cert = /etc/nginxwebui/panel.crt
# tls_key = /etc/nginxwebui/panel.key
